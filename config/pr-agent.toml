# PR-Agent defaults. Mounted from ~/config/pr-agent.toml at runtime (see pr-review).
# Secrets and API URL: ~/config/env

[config]
git_provider = "local"
publish_output = false
verbosity_level = 1
cli_mode = true
use_global_settings_file = false
extra_config_url = ""

[local]
review_path = "review.md"
description_path = "description.md"
improve_path = "improve.md"
